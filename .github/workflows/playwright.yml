name: Scheduled Playwright Tests

on:
  workflow_dispatch:

  schedule:
    # 05:00 по Минску = 02:00 UTC
    - cron: "0 2 * * *"

jobs:
  test:
    runs-on: self-hosted

    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install

      - name: Check site access
        run: |
          echo "Checking application..."
          curl -I \
            -u user:senlatest \
            https://regoffice.senla.eu/

      - name: Run Playwright tests
        id: playwright
        continue-on-error: true
        run: npx playwright test --workers=3

      - name: Generate single-file Allure report
        if: always()
        run: |
          if [ -d "allure-results" ]; then
            rm -rf allure-report
            npx allure generate allure-results --clean -o allure-report --single-file
            cp allure-report/index.html allure-report.html
          else
            echo "allure-results directory does not exist"
            exit 1
          fi

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report.html
          if-no-files-found: warn
          retention-days: 30

      - name: Send Allure report by email
        if: always()
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "Playwright tests - ${{ steps.playwright.outcome }}"

          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}

          body: |
            Автоматические Playwright тесты завершены.

            Результат: ${{ steps.playwright.outcome }}

            Полный Allure отчет находится во вложении.

            Repository:
            ${{ github.repository }}

            Run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          attachments: allure-report.html

      - name: Fail workflow if tests failed
        if: always() && steps.playwright.outcome == 'failure'
        run: |
          echo "Playwright tests failed"
          exit 1