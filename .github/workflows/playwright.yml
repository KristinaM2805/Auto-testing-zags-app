name: Scheduled Playwright Tests

on:
  workflow_dispatch:

  schedule:
    - cron: '0 5 * * *'
      timezone: 'Europe/Minsk'

jobs:
  test:
    runs-on:  self-hosted

    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install
      - name: Clean old Allure results
        run: rm -rf allure-results allure-report test-report.html

      - name: Check site access
        run: |
          echo "=== HEAD ==="
          curl -I -u user:senlatest https://regoffice.senla.eu/ || true

          echo "=== BODY ==="
          curl -u user:senlatest https://regoffice.senla.eu/ -o response.html -s -w "\nHTTP STATUS: %{http_code}\n"

          echo "=== FIRST 50 LINES ==="
          head -50 response.html || true
      
      - name: Check API access
        run: |
          curl -u user:senlatest \
            -i \
            https://regoffice.senla.eu/getApplications || true

      - name: Run Playwright tests
        id: playwright
        continue-on-error: true
        run: npx playwright test --workers=3

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Prepare HTML report for email
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          source = Path("allure-report/export/mail.html")
          html = source.read_text(encoding="utf-8")

          run_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}"
          )

          block = f'''
          <div style="margin:24px 0;padding:18px;border:1px solid #ddd;border-radius:8px;font-family:Arial,sans-serif;">
            <h2 style="margin:0 0 10px 0;">Full Allure report</h2>
            <p style="margin:0 0 12px 0;">
              The complete Allure report is stored in GitHub Actions as the
              <strong>allure-report</strong> artifact.
            </p>
            <p style="margin:0;">
              <a href="{run_url}" style="font-size:16px;font-weight:bold;">
                Open the full report in GitHub Actions
              </a>
            </p>
          </div>
          '''

          if "</body>" in html:
              html = html.replace("</body>", block + "\n</body>")
          else:
              html += block

          Path("test-report.html").write_text(html, encoding="utf-8")
          PY

      - name: Upload full Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7

      - name: Send report by email
        if: always()
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: Playwright tests - ${{ job.status }} - ${{ github.repository }}

          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}

          body: |
            Automated Playwright test run completed.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Run number: ${{ github.run_number }}

            A short HTML report is attached.
            The same HTML report contains a link to the full Allure report stored in GitHub Actions.

          attachments: test-report.html

      - name: Fail workflow if tests failed
        if: steps.playwright.outcome == 'failure'
        run: exit 1
